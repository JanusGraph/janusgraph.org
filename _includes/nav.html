<header class="site-header" id="top">
  <div class="container nav-wrap">
    <a class="brand" href="#top" aria-label="JanusGraph – back to top">
      {% include logomark.svg %}
      <span class="brand-name">JanusGraph</span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <ul class="nav-links">
        <li><a href="#features">Features</a></li>
        <li><a href="#ecosystem">Ecosystem</a></li>
        <li><a href="#users">Users</a></li>
        <li><a href="#presentations">Presentations</a></li>
        <li><a href="#community">Community</a></li>
        <li><a href="{{ site.project.docs }}">Docs</a></li>
        <li><a href="{{ site.project.releases }}">Download</a></li>
      </ul>
      <div class="nav-actions">
        <a class="btn btn-ghost btn-sm" href="{{ site.project.donate }}">
          {% include icon.html name="heart" %}<span>Donate</span>
        </a>
        <a class="btn btn-dark btn-sm gh-btn" href="{{ site.project.repo_url }}">
          {% include icon.html name="github" %}<span>GitHub</span><span class="gh-stars" data-stars hidden></span>
        </a>
      </div>
    </nav>

    <div class="header-tools">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Theme: system. Switch to light" title="Theme: system">
        {% include icon.html name="monitor" class="icon-system" %}
        {% include icon.html name="sun" class="icon-light" %}
        {% include icon.html name="moon" class="icon-dark" %}
      </button>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        {% include icon.html name="menu" class="icon-menu" %}
        {% include icon.html name="close" class="icon-close" %}
      </button>
    </div>
  </div>
</header>
