# Site settings
title: JanusGraph
tagline: Distributed, open source, massively scalable graph database
url: https://janusgraph.org
description: "JanusGraph is a scalable, transactional graph database optimized for storing and querying graphs containing hundreds of billions of vertices and edges distributed across a multi-machine cluster."
keywords: "database, graph, distributed, scalable, janusgraph, opensource, gremlin, tinkerpop"
lang: en

# Google webmaster tools
google_verify:

# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Upcoming events list. Rendered by _includes/events.html when non-empty.
# Each entry may contain HTML. Example:
# upcoming_events:
#  - <a href="${event_link}">Event name</a>, Speakers or additional information - ${date}

# Project links used across the site
project:
  repo: JanusGraph/janusgraph
  repo_url: https://github.com/JanusGraph/janusgraph
  docs: https://docs.janusgraph.org
  getting_started: https://docs.janusgraph.org/getting-started/installation/
  releases: https://github.com/JanusGraph/janusgraph/releases
  changelog: https://docs.janusgraph.org/changelog/
  donate: https://crowdfunding.linuxfoundation.org/initiatives/janusgraph
  all_users: https://github.com/JanusGraph/janusgraph/blob/master/README.md#powered-by-janusgraph
  users_list: https://lists.lfaidata.foundation/g/janusgraph-users/topics
  dev_list: https://lists.lfaidata.foundation/g/janusgraph-dev/topics
  gremlin_users: https://groups.google.com/forum/#!forum/gremlin-users
  lf_project: https://lfaidata.foundation/projects/janusgraph/
  youtube: https://www.youtube.com/channel/UCmG9rmIj89bL5YykKda_jIQ

# Social networks. `icon` must match a symbol id in _includes/icons.html (i-<icon>).
social:
  - name: GitHub
    icon: github
    url: https://github.com/JanusGraph/janusgraph
  - name: Discord
    icon: discord
    url: https://discord.gg/5n4fjv4QAf
  - name: Stack Overflow
    icon: stackoverflow
    url: https://stackoverflow.com/questions/tagged/janusgraph
  - name: X (Twitter)
    icon: x
    url: https://twitter.com/JanusGraph
  - name: LinkedIn
    icon: linkedin
    url: https://www.linkedin.com/company/janusgraph
  - name: YouTube
    icon: youtube
    url: https://www.youtube.com/channel/UCmG9rmIj89bL5YykKda_jIQ
  - name: Mailing list
    icon: mail
    url: https://lists.lfaidata.foundation/g/janusgraph-users/topics

# Build settings
markdown: kramdown
permalink: pretty
exclude:
  - Makefile
  - README.md
  - Gemfile
  - Gemfile.lock
  - .travis.yml
  - .idea
  - .junie
  - node_modules
  - vendor
